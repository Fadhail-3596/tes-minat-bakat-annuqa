<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Hasil Tes Minat Bakat</title>
<style>
  body { font-family: "Times New Roman", serif; padding: 40px; }
  h1,h3 { text-align: center; margin: 0.5rem 0; }
  .logo { text-align: center; margin-bottom: 20px; }
  .logo img { width: 120px; margin-bottom: 10px; }
  .score-list { list-style: none; padding-left: 0; margin-bottom: 1.5rem; }
  .score-list li { margin: 5px 0; }
  .recommendation-text { border-left: 4px solid #000; padding: 0.8rem; background: #f8f8f8; margin-bottom: 1.5rem; }
  hr { margin: 1.5rem 0; }
</style>
</head>
<body>

<div class="logo">
  <img src="assets/logo.png" alt="Logo">
  <h1>Universitas Annuqayah</h1>
  <h3>Hasil Tes Minat & Potensi Akademik</h3>
</div>

<hr>

<p><strong>Nama Peserta:</strong> <span id="pNama"></span></p>
<p><strong>Asal Sekolah:</strong> <span id="pSekolah"></span></p>

<h3>Feedback</h3>
<div id="pNarrative"></div>

<h3>Skor Potensi</h3>
<ul class="score-list">
  <li>Humaniora: <span id="pHumaniora"></span></li>
  <li>Sains: <span id="pSains"></span></li>
  <li>Keagamaan: <span id="pKeagamaan"></span></li>
  <li>Teknologi: <span id="pTeknologi"></span></li>
</ul>

<h3>Rekomendasi Utama</h3>
<p id="pRekomendasi" class="recommendation-text"></p>

<script src="js/scoring.js"></script>
<script>
const data = JSON.parse(localStorage.getItem("hasilTes"));
if (!data) { alert("Data tidak ditemukan."); window.close(); }
else {
  document.getElementById("pNama").innerText = data.nama ?? "-";
  document.getElementById("pSekolah").innerText = data.asalSekolah ?? "-";
  document.getElementById("pHumaniora").innerText = data.skorHumaniora ?? 0;
  document.getElementById("pSains").innerText = data.skorSains ?? 0;
  document.getElementById("pKeagamaan").innerText = data.skorKeagamaan ?? 0;
  document.getElementById("pTeknologi").innerText = data.skorTeknologi ?? 0;
  document.getElementById("pRekomendasi").innerText = data.rekomendasi ?? "-";
  document.getElementById("pNarrative").innerHTML = data.narrative ?? "-";
}

window.onload = () => { window.print(); };
</script>

</body>
</html>
